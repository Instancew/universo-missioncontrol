# MediaMTX 1.21.4. Isolated rover network; no internet exposure.
# MTX_WEBRTCADDITIONALHOSTS and MTX_WEBRTCALLOWORIGINS come from rover.env.
logLevel: info
logDestinations: [stdout]
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: false
hls: false
srt: false
moq: false
api: false
webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ''
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: []
webrtcAllowOrigins: []
authInternalUsers:
  - user: any
    ips: [127.0.0.1, '::1']
    permissions:
      - action: publish
        path: rovercam
  - user: any
    ips: [10.43.0.0/24]
    permissions:
      - action: read
        path: rovercam
paths:
  rovercam:
    source: publisher
    overridePublisher: false
